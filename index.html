<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Uang</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213d">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5d6b85;--line:#d9dfea;--in:#0b8f7e;--out:#d6393f;--acc:#14213d;--onacc:#fff;--warn:#e09a00}
:root[data-theme=dark]{--bg:#0e1424;--card:#172038;--ink:#e8edf8;--mut:#93a0bb;--line:#2a3554;--in:#2ecfb8;--out:#ff6b70;--acc:#e8edf8;--onacc:#0e1424;--warn:#f2b632}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.05rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
button.g{border:0;background:none;color:var(--mut);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button[aria-pressed=true]{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.mon{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mon input{text-align:center}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:1.05rem;word-break:break-word}
.sum span{font-size:.8rem;color:var(--mut)}
.in{color:var(--in)}.out{color:var(--out)}
.bar{margin-bottom:12px}
.bar .t{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.trk{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:4px 0}
.trk i{display:block;height:100%;background:var(--out);border-radius:6px}
.bar small{color:var(--mut)}
.tx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:0}
.tx .m{min-width:0}
.tx .m small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:600;white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.alert{border-left:4px solid var(--warn);padding:8px 12px;margin-bottom:12px;background:var(--bg);border-radius:6px;font-size:.9rem}
.empty{color:var(--mut);text-align:center;padding:12px 0;margin:0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(440px,92vw);max-height:88vh}
dialog::backdrop{background:#0008}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.95rem;color:var(--ink)}
.chk input{width:auto}
@media(prefers-reduced-motion:no-preference){.trk i{transition:width .4s}}
</style>
</head>
<body>
<main>
<header>
  <h1>Catatan Uang</h1>
  <div class="tools">
    <button id="bBud" type="button">Anggaran</button>
    <button id="bTheme" type="button" aria-label="Ganti mode gelap">Mode</button>
  </div>
</header>

<section class="card" aria-label="Ringkasan bulan">
  <div class="mon">
    <button id="prev" type="button" aria-label="Bulan sebelumnya">‹</button>
    <input id="month" type="month" aria-label="Pilih bulan">
    <button id="next" type="button" aria-label="Bulan berikutnya">›</button>
  </div>
  <div class="sum">
    <div><span>Pemasukan</span><b class="in" id="sIn">0</b></div>
    <div><span>Pengeluaran</span><b class="out" id="sOut">0</b></div>
    <div><span>Sisa saldo</span><b id="sBal">0</b></div>
  </div>
</section>

<section class="card" aria-label="Tambah transaksi">
  <h2 id="fTitle">Tambah transaksi</h2>
  <div class="seg" role="group" aria-label="Jenis transaksi">
    <button type="button" id="tOut" aria-pressed="true">Pengeluaran</button>
    <button type="button" id="tIn" aria-pressed="false">Pemasukan</button>
  </div>
  <div class="row">
    <div><label for="amt">Nominal (Rp)</label><input id="amt" type="number" inputmode="numeric" min="1" placeholder="25000"></div>
    <div><label for="cat">Kategori</label><select id="cat"></select></div>
    <div><label for="date">Tanggal</label><input id="date" type="date"></div>
    <div><label for="note">Catatan</label><input id="note" type="text" maxlength="80" placeholder="Makan siang"></div>
  </div>
  <label class="chk"><input id="rec" type="checkbox"> Ulangi setiap bulan (kos, langganan)</label>
  <div class="tools">
    <button class="p" id="save" type="button">Simpan transaksi</button>
    <button id="cancel" type="button" hidden>Batal edit</button>
  </div>
  <p id="err" class="out" role="alert" style="margin:8px 0 0"></p>
</section>

<section class="card" aria-label="Grafik per kategori">
  <h2>Pengeluaran per kategori</h2>
  <div id="alerts"></div>
  <div id="chart"></div>
</section>

<section class="card" aria-label="Riwayat transaksi">
  <h2>Riwayat transaksi</h2>
  <div id="list"></div>
</section>

<section class="card" aria-label="Data">
  <h2>Data</h2>
  <div class="tools">
    <button id="bCsv" type="button">Ekspor CSV</button>
    <button id="bBak" type="button">Backup data</button>
    <button id="bRes" type="button">Pulihkan data</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
</section>
</main>

<dialog id="dlg">
  <h2>Batas anggaran bulanan</h2>
  <p style="color:var(--mut);font-size:.9rem;margin-top:0">Kosongkan atau isi 0 jika tidak ingin membatasi.</p>
  <div id="bform"></div>
  <div class="tools" style="margin-top:12px">
    <button class="p" id="bSave" type="button">Simpan anggaran</button>
    <button id="bClose" type="button">Tutup</button>
  </div>
</dialog>

<script>
const KEY='catatan-uang-v1';
const CATS={out:['Makan','Transport','Belanja','Tagihan','Hiburan','Pendidikan','Kesehatan','Lainnya'],in:['Gaji','Uang saku','Bonus','Lainnya']};
const $=id=>document.getElementById(id);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const ym=d=>d.slice(0,7);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={tx:[],bud:{},total:0,theme:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let type='out',editId=null,cur=today().slice(0,7);

/* mode gelap */
function theme(){const d=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=d?'dark':'light';
  document.querySelector('meta[name=theme-color]').content=d?'#0e1424':'#14213d'}
$('bTheme').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();theme()};

/* transaksi berulang: buat salinan tiap bulan sampai bulan ini */
function addMonths(m,n){let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=(mo-1)%12+1;return y+'-'+String(mo).padStart(2,'0')}
function runRecurring(){let ch=false;const now=today().slice(0,7);
  S.tx.filter(t=>t.rec).forEach(t=>{let m=addMonths(t.last||ym(t.date),1);
    while(m<=now){const[y,mo]=m.split('-').map(Number);const dim=new Date(y,mo,0).getDate();
      const day=Math.min(+t.date.slice(8),dim);
      S.tx.push({id:uid(),type:t.type,amt:t.amt,cat:t.cat,note:t.note,date:m+'-'+String(day).padStart(2,'0'),src:t.id});
      t.last=m;m=addMonths(m,1);ch=true}});
  if(ch)save()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* form */
function fillCats(){$('cat').innerHTML=CATS[type].map(c=>`<option>${c}</option>`).join('')}
function setType(t){type=t;$('tOut').setAttribute('aria-pressed',t==='out');$('tIn').setAttribute('aria-pressed',t==='in');fillCats()}
$('tOut').onclick=()=>setType('out');$('tIn').onclick=()=>setType('in');
function resetForm(){editId=null;$('amt').value='';$('note').value='';$('date').value=today();$('rec').checked=false;
  $('fTitle').textContent='Tambah transaksi';$('save').textContent='Simpan transaksi';$('cancel').hidden=true;$('err').textContent='';setType('out')}
$('cancel').onclick=resetForm;
$('save').onclick=()=>{
  const amt=+$('amt').value,date=$('date').value;
  if(!(amt>0)){$('err').textContent='Isi nominal lebih dari 0.';return}
  if(!date){$('err').textContent='Pilih tanggal transaksi.';return}
  const o={type,amt,cat:$('cat').value,note:$('note').value.trim(),date};
  if(editId){const t=S.tx.find(x=>x.id===editId);Object.assign(t,o);if($('rec').checked&&!t.src){t.rec=true}else if(!$('rec').checked){delete t.rec}}
  else{const t=Object.assign({id:uid()},o);if($('rec').checked){t.rec=true;t.last=ym(date)}S.tx.push(t)}
  save();cur=ym(date);resetForm();render()};
function edit(id){const t=S.tx.find(x=>x.id===id);editId=id;setType(t.type);
  $('amt').value=t.amt;$('cat').value=t.cat;$('date').value=t.date;$('note').value=t.note;$('rec').checked=!!t.rec;
  $('fTitle').textContent='Ubah transaksi';$('save').textContent='Simpan perubahan';$('cancel').hidden=false;scrollTo({top:0})}
function del(id){if(confirm('Hapus transaksi ini?')){S.tx=S.tx.filter(x=>x.id!==id);save();render()}}

/* bulan */
$('month').onchange=e=>{if(e.target.value){cur=e.target.value;render()}};
$('prev').onclick=()=>{cur=addMonths(cur,-1);render()};
$('next').onclick=()=>{cur=addMonths(cur,1);render()};

/* tampilan */
function render(){
  $('month').value=cur;
  const L=S.tx.filter(t=>ym(t.date)===cur).sort((a,b)=>b.date.localeCompare(a.date));
  const sum=ty=>L.filter(t=>t.type===ty).reduce((s,t)=>s+t.amt,0);
  const i=sum('in'),o=sum('out');
  $('sIn').textContent=rp(i);$('sOut').textContent=rp(o);
  const b=$('sBal');b.textContent=rp(i-o);b.className=i-o<0?'out':'';
  /* grafik + peringatan */
  const by={};L.filter(t=>t.type==='out').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amt);
  const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=ent.length?ent[0][1]:1;
  const al=[];
  if(S.total>0&&o>=S.total*.8)al.push(o>S.total?`Total pengeluaran melewati batas bulanan (${rp(o)} dari ${rp(S.total)}).`:`Total pengeluaran sudah ${Math.round(o/S.total*100)}% dari batas bulanan ${rp(S.total)}.`);
  ent.forEach(([c,v])=>{const lim=S.bud[c];if(lim>0&&v>=lim*.8)al.push(v>lim?`${c} melewati batas: ${rp(v)} dari ${rp(lim)}.`:`${c} sudah ${Math.round(v/lim*100)}% dari batas ${rp(lim)}.`)});
  $('alerts').innerHTML=al.map(a=>`<div class="alert" role="status">${esc(a)}</div>`).join('');
  $('chart').innerHTML=ent.length?ent.map(([c,v])=>{const lim=S.bud[c]||0,over=lim>0&&v>lim;
    return `<div class="bar"><div class="t"><span>${esc(c)}</span><b>${rp(v)}</b></div>
    <div class="trk"><i style="width:${v/max*100}%;${over?'background:var(--warn)':''}"></i></div>
    <small>${Math.round(v/o*100)}% dari pengeluaran${lim>0?` · batas ${rp(lim)}`:''}</small></div>`}).join('')
    :'<p class="empty">Belum ada pengeluaran bulan ini. Tambahkan transaksi di atas.</p>';
  /* daftar */
  $('list').innerHTML=L.length?L.map(t=>`<div class="tx"><div class="m"><b>${esc(t.cat)}</b>${t.rec||t.src?' <small style="display:inline">(berulang)</small>':''}
    <small>${t.date.split('-').reverse().join('/')}${t.note?' · '+esc(t.note):''}</small></div>
    <div class="a ${t.type}">${t.type==='in'?'+':'−'}${rp(t.amt)}</div>
    <div><button class="g" data-e="${t.id}" aria-label="Ubah">Ubah</button><button class="g" data-d="${t.id}" aria-label="Hapus">Hapus</button></div></div>`).join('')
    :'<p class="empty">Belum ada transaksi di bulan ini.</p>';
}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)edit(b.dataset.e);if(b.dataset.d)del(b.dataset.d)};

/* anggaran */
$('bBud').onclick=()=>{$('bform').innerHTML=`<div class="row"><div class="full"><label for="b_total">Total semua pengeluaran</label><input id="b_total" type="number" min="0" value="${S.total||''}"></div>`+
  CATS.out.map((c,i)=>`<div><label for="b${i}">${c}</label><input id="b${i}" type="number" min="0" value="${S.bud[c]||''}"></div>`).join('')+'</div>';
  $('dlg').showModal()};
$('bSave').onclick=()=>{S.total=+$('b_total').value||0;CATS.out.forEach((c,i)=>{const v=+$('b'+i).value;if(v>0)S.bud[c]=v;else delete S.bud[c]});save();$('dlg').close();render()};
$('bClose').onclick=()=>$('dlg').close();

/* ekspor, backup, pulihkan */
function dl(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)}
$('bCsv').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['Tanggal','Jenis','Kategori','Nominal','Catatan']].concat(S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.cat,t.amt,t.note]));
  dl('catatan-uang.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv')};
$('bBak').onclick=()=>dl('backup-catatan-uang-'+today()+'.json',JSON.stringify(S),'application/json');
$('bRes').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;
    if(confirm('Data saat ini akan diganti dengan isi backup. Lanjutkan?')){S=Object.assign({tx:[],bud:{},total:0,theme:S.theme},d);save();render()}}
    catch(x){alert('File backup tidak valid.')}e.target.value=''};r.readAsText(f)};

/* mulai */
theme();matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!S.theme)theme()});
runRecurring();resetForm();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
